# Netlify settings for the Bellwood Construction site.
# Nothing here needs changing — it just tells Netlify how to serve the files.

[build]
  publish = "."
  # No build step: these are plain HTML/CSS/JS files.
  command = ""

# Photos and fonts never change once published, so let browsers keep them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Code changes when you edit it, so always check for a fresh copy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
